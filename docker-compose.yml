services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: trove
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trove
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # web console
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
