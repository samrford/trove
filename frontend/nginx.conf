server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — unknown routes serve index.html so the SvelteKit
    # client router handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed SvelteKit assets (under /_app/immutable/...)
    location /_app/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html — it's the entry point and points at the
    # latest hashed asset filenames.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
