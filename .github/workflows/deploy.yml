name: Deploy to Fly.io

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which app to deploy?'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - frontend
          - backend
      app_version:
        description: 'Version to embed (e.g. 1.2.3). Defaults to dev if blank.'
        required: false
        default: ''
        type: string

  workflow_call:
    inputs:
      target:
        description: 'Which app to deploy?'
        required: false
        default: 'all'
        type: string
      app_version:
        description: 'Version string to embed in the backend binary'
        required: false
        default: ''
        type: string
    secrets:
      FLY_API_TOKEN:
        required: true

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy-backend:
    name: Deploy backend
    if: inputs.target == 'all' || inputs.target == 'backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy backend to Fly
        run: |
          flyctl deploy --remote-only \
            --build-arg APP_VERSION=${{ inputs.app_version }}
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    name: Deploy frontend
    if: inputs.target == 'all' || inputs.target == 'frontend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy frontend to Fly
        # All public build args (PUBLIC_*) are baked into frontend/fly.toml under
        # [build.args], so flyctl picks them up automatically — no --build-arg
        # flags needed here unless we ever pass dynamic values (e.g. version).
        run: flyctl deploy --remote-only
        working-directory: ./frontend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
